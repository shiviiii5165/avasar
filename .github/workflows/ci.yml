# Continuous integration for Avsar. Runs on pull requests and pushes; never deploys.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: avsar
          POSTGRES_PASSWORD: avsar-ci-only
          POSTGRES_DB: avsar_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U avsar" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Migrations are in sync with the schema
        run: npx drizzle-kit check
      - name: Migrations apply cleanly to an empty PostgreSQL
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://avsar:avsar-ci-only@localhost:5432/avsar_ci
      - name: Production build
        run: npm run build
        env:
          AVSAR_PUBLIC_URL: https://ci.invalid
      - name: Dependency audit (high and critical, production deps)
        run: npm audit --omit=dev --audit-level=high